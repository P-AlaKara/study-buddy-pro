  <rect width="1200" height="520" rx="28" fill="#fffafa"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <path d="M30 280h92l16-25 16 25h35l20-120 24 205 28-85h82l16-25 16 25h35l20-120 24 205 28-85h82l16-25 16 25h35l20-120 24 205 28-85h82l16-25 16 25h35l20-120 24 205 28-85h82" fill="none" stroke="#26343f" stroke-width="6" stroke-linejoin="round"/>
  <rect x="250" y="40" width="700" height="92" rx="18" fill="#f8f4ea"/>
  <text x="600" y="80" fill="#26343f" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">PLACEHOLDER — SINUS TACHYCARDIA ECG</text>
  <text x="600" y="112" fill="#52616d" font-family="sans-serif" font-size="18" text-anchor="middle">Verified open-licensed image required</text>
