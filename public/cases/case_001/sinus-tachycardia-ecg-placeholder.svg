<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sinus tachycardia ECG placeholder</title>
  <desc id="desc">A labelled placeholder awaiting a verified open-licensed twelve-lead ECG showing sinus tachycardia.</desc>
