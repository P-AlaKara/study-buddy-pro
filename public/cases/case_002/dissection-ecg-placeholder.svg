  <rect width="1200" height="520" rx="28" fill="#fffafa"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <path d="M30 280h110l16-21 18 21h30l22-102 20 175 32-73h115l16-21 18 21h30l22-102 20 175 32-73h115l16-21 18 21h30l22-102 20 175 32-73h115" fill="none" stroke="#26343f" stroke-width="6" stroke-linejoin="round"/>
  <rect x="238" y="40" width="724" height="92" rx="18" fill="#f8f4ea"/>
  <text x="600" y="80" fill="#26343f" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">PLACEHOLDER — ECG WITHOUT STEMI</text>
